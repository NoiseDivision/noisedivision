<!doctype html><html><head><meta charset="utf-8">
<!-- DARK artwork: renders the static image layers the plugin uses (Assets/*.png).
     Open with #layer=bg&dark=0, bg&dark=1, moon&red=0, moon&red=1, candle, small.
     Rendered at 2x by art.js (Playwright). Everything that moves is drawn by the plugin itself. -->
<style>
@font-face { font-family: Cinzel; font-weight: 600; src: url(fonts/cinzel-latin-600-normal.woff2); }
@font-face { font-family: Oswald; font-weight: 500; src: url(fonts/oswald-latin-500-normal.woff2); }
@font-face { font-family: Mont; font-weight: 500; src: url(fonts/montserrat-latin-500-normal.woff2); }
html, body { margin: 0; background: transparent; }
canvas { display: block; }
</style></head><body>
<canvas id="c"></canvas>
<script>
const P = new URLSearchParams(location.hash.slice(1));
const LAYER = P.get('layer') || 'bg';
const DARKV = parseFloat(P.get('dark') || '0'), RED = parseFloat(P.get('red') || '0');
const sizes = { bg: [520, 680], moon: [156, 156], candle: [60, 50], small: [88, 88] };
const [W, H] = sizes[LAYER];
const cv = document.getElementById('c'); cv.width = W * 2; cv.height = H * 2; cv.style.width = W + 'px'; cv.style.height = H + 'px';
const g = cv.getContext('2d'); g.scale(2, 2);
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const mix = (a, b, t) => a.map((x, i) => Math.round(x + (b[i] - x) * t));
const rgb = (c, a = 1) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;

function branch(x, y, len, ang, w, depth, col) {
  if (depth <= 0 || len < 4) return;
  const nx = x + Math.cos(ang) * len, ny = y + Math.sin(ang) * len;
  g.strokeStyle = col; g.lineWidth = w; g.lineCap = 'round';
  g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo((x + nx) / 2 + (rnd() - .5) * len * .3, (y + ny) / 2 + (rnd() - .5) * len * .3, nx, ny); g.stroke();
  const n = rnd() < .5 ? 2 : 3;
  for (let i = 0; i < n; ++i) branch(nx, ny, len * (0.6 + rnd() * 0.2), ang + (rnd() - .5) * 1.3, w * 0.62, depth - 1, col);
}

// ---- the room, the title and the knob housing (everything static on the main panel)
function background(dark) {
  const light = 1 - 0.72 * dark, cx = 260, cy = 340;
  g.fillStyle = '#050508'; g.fillRect(0, 0, W, H);
  let mg = g.createRadialGradient(cx, 40, 10, cx, 120, 420);
  mg.addColorStop(0, `rgba(150,165,190,${0.20 * light})`); mg.addColorStop(0.5, `rgba(70,80,100,${0.08 * light})`); mg.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = mg; g.fillRect(0, 0, W, H);
  seed = 7;
  g.save(); g.filter = 'blur(26px)';
  for (let i = 0; i < 26; ++i) {
    const x = rnd() * W, y = 120 + rnd() * (H - 120), r = 40 + rnd() * 110;
    g.fillStyle = `rgba(120,130,150,${(0.035 + rnd() * 0.05) * light})`;
    g.beginPath(); g.ellipse(x, y, r * 1.8, r * 0.55, 0, 0, 6.283); g.fill();
  }
  g.restore();
  seed = 21;
  const bc = `rgba(${Math.round(30 + 22 * light)},${Math.round(30 + 22 * light)},${Math.round(38 + 26 * light)},0.9)`;
  branch(-10, 150, 70, 0.15, 6, 6, bc); branch(-10, 470, 60, -0.35, 5, 6, bc);
  branch(W + 10, 110, 70, Math.PI - 0.1, 6, 6, bc); branch(W + 10, 520, 62, Math.PI + 0.4, 5, 6, bc);
  seed = 33;
  for (let i = 0; i < 9000; ++i) { g.fillStyle = `rgba(${rnd() < .5 ? '255,255,255' : '0,0,0'},${0.035 * rnd()})`; g.fillRect(rnd() * W, rnd() * H, 1, 1); }
  const fl = g.createLinearGradient(0, H - 240, 0, H); fl.addColorStop(0, 'rgba(120,10,16,0)'); fl.addColorStop(1, `rgba(120,10,16,${0.22 * dark * dark})`);
  g.fillStyle = fl; g.fillRect(0, H - 240, W, 240);
  const vg = g.createRadialGradient(cx, 330, 140 - 40 * dark, cx, 330, 470 - 150 * dark);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, `rgba(0,0,0,${0.55 + 0.4 * dark})`);
  g.fillStyle = vg; g.fillRect(0, 0, W, H);

  // title, worn
  g.textAlign = 'center'; g.textBaseline = 'alphabetic';
  g.font = '600 66px Cinzel'; g.letterSpacing = '22px';
  const tc = mix([214, 219, 228], [170, 160, 165], dark);
  const t = document.createElement('canvas'); t.width = W * 2; t.height = 140 * 2; const tg = t.getContext('2d'); tg.scale(2, 2);
  tg.textAlign = 'center'; tg.font = g.font; tg.letterSpacing = '22px';
  tg.shadowColor = `rgba(150,170,200,${0.45 * light})`; tg.shadowBlur = 18; tg.fillStyle = rgb(tc); tg.fillText('DARK', cx + 11, 96);
  tg.globalCompositeOperation = 'destination-out'; seed = 99;
  for (let i = 0; i < 900; ++i) { tg.fillStyle = `rgba(0,0,0,${0.6 * rnd()})`; tg.fillRect(152 + rnd() * 220, 40 + rnd() * 62, 1 + rnd() * 2, 1 + rnd() * 1.5); }
  g.drawImage(t, 0, 0, W, 140);
  g.letterSpacing = '0px';
  // the wires either side of the eclipse emblem (the emblem itself is drawn by the plugin)
  g.strokeStyle = 'rgba(160,170,190,.35)'; g.lineWidth = 1;
  g.beginPath(); g.moveTo(202, 120); g.lineTo(246, 120); g.moveTo(274, 120); g.lineTo(318, 120); g.stroke();
  [[200, 120], [320, 120]].forEach(([x, y]) => { g.beginPath(); g.arc(x, y, 2.2, 0, 6.283); g.stroke(); });

  // knob housing and knurled bezel
  g.fillStyle = '#08080b'; g.beginPath(); g.arc(cx, cy, 140, 0, 6.283); g.fill();
  g.strokeStyle = 'rgba(160,170,190,.10)'; g.lineWidth = 1; g.stroke();
  const a0 = Math.PI * 0.75, a1 = Math.PI * 2.25;
  g.font = '500 9px Mont'; g.fillStyle = 'rgba(170,175,190,.5)'; g.textAlign = 'center';
  g.fillText('0', cx + Math.cos(a0) * 150, cy + Math.sin(a0) * 150 + 10); g.fillText('100', cx + Math.cos(a1) * 150, cy + Math.sin(a1) * 150 + 10); g.fillText('50', cx, cy - 151);
  g.save(); g.shadowColor = 'rgba(0,0,0,.9)'; g.shadowBlur = 24; g.shadowOffsetY = 8;
  const bz = g.createLinearGradient(cx, cy - 102, cx, cy + 102); bz.addColorStop(0, '#2a2a31'); bz.addColorStop(1, '#0a0a0d');
  g.fillStyle = bz; g.beginPath(); g.arc(cx, cy, 102, 0, 6.283); g.fill(); g.restore();
  for (let i = 0; i < 120; ++i) { const a = i / 120 * 6.283; g.strokeStyle = i % 2 ? 'rgba(0,0,0,.6)' : 'rgba(90,90,105,.25)'; g.lineWidth = 1.2;
    g.beginPath(); g.moveTo(cx + Math.cos(a) * 92, cy + Math.sin(a) * 92); g.lineTo(cx + Math.cos(a) * 101, cy + Math.sin(a) * 101); g.stroke(); }
  // the dark well the moon sits in
  g.fillStyle = '#020203'; g.beginPath(); g.arc(cx, cy, 84, 0, 6.283); g.fill();

  // IN / OUT labels
  g.font = '500 9px Oswald'; g.letterSpacing = '2px'; g.fillStyle = 'rgba(205,212,224,.55)';
  g.textAlign = 'left'; g.fillText('IN', 10, 270); g.textAlign = 'right'; g.fillText('OUT', W - 8, 270); g.letterSpacing = '0px';
}

// ---- the moon face (radius 78), pale or as a blood moon
function moon(red) {
  const cx = W / 2, cy = H / 2, R = 78;
  const moonCol = mix([214, 218, 226], [150, 30, 34], red), moonEdge = mix([110, 116, 130], [50, 6, 10], red);
  const mgd = g.createRadialGradient(cx - 26, cy - 30, 6, cx, cy, R * 1.12);
  mgd.addColorStop(0, rgb(mix(moonCol, [255, 255, 255], 0.25 * (1 - red)))); mgd.addColorStop(0.6, rgb(moonCol)); mgd.addColorStop(1, rgb(moonEdge));
  g.fillStyle = mgd; g.beginPath(); g.arc(cx, cy, R, 0, 6.283); g.fill();
  g.save(); g.beginPath(); g.arc(cx, cy, R, 0, 6.283); g.clip();
  seed = 5;
  for (let i = 0; i < 22; ++i) { const a = rnd() * 6.283, d = Math.sqrt(rnd()) * (R - 10), r = 2 + rnd() * 9;
    g.fillStyle = `rgba(0,0,0,${0.08 + 0.14 * rnd()})`; g.beginPath(); g.arc(cx + Math.cos(a) * d, cy + Math.sin(a) * d, r, 0, 6.283); g.fill();
    g.strokeStyle = `rgba(255,255,255,${0.05 * (1 - red)})`; g.lineWidth = 0.8; g.beginPath(); g.arc(cx + Math.cos(a) * d - .6, cy + Math.sin(a) * d - .6, r, Math.PI, Math.PI * 1.6); g.stroke(); }
  seed = 61;
  for (let i = 0; i < 2500; ++i) { g.fillStyle = `rgba(${rnd() < .5 ? '255,255,255' : '0,0,0'},${0.06 * rnd()})`; g.fillRect(cx - R + rnd() * 2 * R, cy - R + rnd() * 2 * R, 1, 1); }
  g.restore();
}

// ---- the candle (no flame: the plugin draws the flame and the smoke so they can flicker and drift)
function candle() {
  const kx = 30, ky = 40;
  const wax = g.createLinearGradient(kx - 9, 0, kx + 9, 0); wax.addColorStop(0, '#6d6a62'); wax.addColorStop(0.45, '#cfc8b8'); wax.addColorStop(1, '#4a4741');
  g.fillStyle = wax; g.beginPath(); g.moveTo(kx - 9, ky - 24); g.lineTo(kx + 9, ky - 24); g.lineTo(kx + 9, ky); g.lineTo(kx - 9, ky); g.closePath(); g.fill();
  g.fillStyle = '#cfc8b8'; g.beginPath(); g.ellipse(kx, ky - 24, 9, 2.5, 0, 0, 6.283); g.fill();
  g.fillStyle = '#d8d1c0'; g.beginPath(); g.moveTo(kx + 3, ky - 24); g.quadraticCurveTo(kx + 6, ky - 16, kx + 4, ky - 11); g.quadraticCurveTo(kx + 2, ky - 15, kx + 2, ky - 24); g.fill();
  g.strokeStyle = '#1a1a1a'; g.lineWidth = 1.2; g.beginPath(); g.moveTo(kx, ky - 25); g.lineTo(kx, ky - 30); g.stroke();
  g.fillStyle = '#2a2520'; g.beginPath(); g.ellipse(kx, ky + 1, 20, 4.5, 0, 0, 6.283); g.fill(); g.strokeStyle = 'rgba(160,140,110,.35)'; g.lineWidth = 1; g.stroke();
}

// ---- small knob body for the advanced drawer (88 x 88, body radius 30)
function small() {
  const x = 44, y = 44;
  g.save(); g.shadowColor = 'rgba(0,0,0,.9)'; g.shadowBlur = 10; g.shadowOffsetY = 4;
  const kg = g.createLinearGradient(x, y - 30, x, y + 30); kg.addColorStop(0, '#2b2b32'); kg.addColorStop(1, '#0b0b0e'); g.fillStyle = kg; g.beginPath(); g.arc(x, y, 30, 0, 6.283); g.fill(); g.restore();
  g.strokeStyle = 'rgba(0,0,0,.8)'; g.lineWidth = 1; g.beginPath(); g.arc(x, y, 30, 0, 6.283); g.stroke();
  g.strokeStyle = 'rgba(160,170,190,.08)'; g.beginPath(); g.arc(x, y, 29, Math.PI * 1.1, Math.PI * 1.9); g.stroke();
}

Promise.all(['600 20px Cinzel', '500 12px Oswald', '500 12px Mont'].map(f => document.fonts.load(f))).then(() => document.fonts.ready).then(() => {
  if (LAYER === 'bg') background(DARKV); else if (LAYER === 'moon') moon(RED); else if (LAYER === 'candle') candle(); else small();
  document.body.dataset.ready = 1;
});
</script></body></html>
