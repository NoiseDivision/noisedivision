# Builds all the plugins for Windows and macOS, one download per plugin plus the full suite.
#
#   - Run it by hand: Actions tab -> "Build plugins" -> Run workflow.
#     The finished files appear at the bottom of the run's page under "Artifacts".
#   - Publish a release: push a version tag (for example v1.0.1). The files are then
#     attached to a GitHub Release, which is where the website's download buttons point.
name: Build plugins

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Build the plugins
        shell: bash
        run: |
          set -euo pipefail
          for p in KRUSH PeakSlayer MASTERFUSE SPECTRAKILL DARK SHRAPNEL RECOIL; do
            echo "::group::$p"
            cmake -S "plugins/$p" -B "build/$p" -DCMAKE_BUILD_TYPE=Release
            cmake --build "build/$p" --config Release --parallel 4
            echo "::endgroup::"
          done

      - name: Package for Windows (.zip)
        if: runner.os == 'Windows'
        shell: bash
        run: bash scripts/package-windows.sh

      - name: Package for macOS (.pkg installer)
        if: runner.os == 'macOS'
        run: bash scripts/package-mac.sh

      - name: Check the Audio Units load (auval)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: bash scripts/check-au.sh

      - uses: actions/upload-artifact@v4
        with:
          name: plugins-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create the release (or update it) and attach the files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -l dist
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
              --title "Noise Division plugins ${GITHUB_REF_NAME}" \
              --notes "Free downloads of PEAKSLAYER, KRUSH, MASTERFUSE, SPECTRAKILL, DARK, SHRAPNEL and RECOIL, one by one or all together (NoiseDivision-Suite). Windows: unzip and copy the .vst3 to C:\\Program Files\\Common Files\\VST3. macOS: open the .pkg installer (AU, VST3 and the standalone app)."
          fi
