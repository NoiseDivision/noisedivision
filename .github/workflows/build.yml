# Builds all the plugins for Windows and macOS, one download per plugin plus the full suite.
#
#   - Publish a release: push a version tag (for example v1.1.0). The files are then
#     attached to a GitHub Release, which is where the website's download buttons point.
#   - Run it by hand: Actions tab -> "Build plugins" -> Run workflow. The finished files
#     appear at the bottom of the run's page under "Artifacts". Tick "Rebuild every plugin"
#     to ignore the saved builds.
#
# Only the plugins that changed are compiled. Each plugin's finished build (per system) is kept as a
# file on a hidden pre-release called "build-cache", named after the git fingerprint of the plugin's
# own folder (plugins/<NAME>/). That fingerprint only changes when a file in that folder changes, and
# it is the same on Windows and macOS, so editing this workflow or another plugin doesn't rebuild
# anything. The saved builds don't expire and have no size limit (unlike GitHub's Actions cache), and
# tag runs and branch runs share them. Every release still contains every plugin and both suites.
#
# "build-cache" is a pre-release, so it is never the "latest" release the website links to. Don't
# delete it: if you do, every plugin simply compiles once more. To force a full rebuild after
# changing the build steps themselves, raise RECIPE below (or tick "Rebuild every plugin").
#
# Adding a plugin: add it to the "plugin" list below and to scripts/plugins.sh.
name: Build plugins

on:
  push:
    tags: ["v*"]
    branches: [main, master]
    paths:
      - "plugins/**"
      - "scripts/*.sh"
      - ".github/workflows/build.yml"
  workflow_dispatch:
    inputs:
      rebuild_all:
        description: "Rebuild every plugin (ignore the saved builds)"
        type: boolean
        default: false

permissions:
  contents: write

env:
  RECIPE: "2"   # raise this when the build steps change, to rebuild every plugin once

jobs:
  # ---- tags only, first: keep the download links working while the plugins build.
  # The site links to the newest ("latest") release. A release published on github.com before the
  # files are ready would be the latest one with nothing in it, so every download would fail until
  # the build ends. If that's the case, "latest" goes back to the previous release for now.
  keep-links:
    name: Keep the download links working
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Point "latest" at the previous release while this one has no files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"; tag="$GITHUB_REF_NAME"
          if ! gh release view "$tag" --repo "$repo" > /dev/null 2>&1; then
            echo "No release for $tag yet: nothing to do (the release is created with its files at the end)."; exit 0
          fi
          files=$(gh release view "$tag" --repo "$repo" --json assets --jq '.assets | length')
          if [ "$files" -gt 0 ]; then echo "$tag already has its files."; exit 0; fi
          prev=$(gh release list --repo "$repo" --exclude-drafts --exclude-pre-releases --limit 20 --json tagName --jq ".[].tagName" | grep -vx "$tag" | head -1 || true)
          if [ -z "$prev" ]; then echo "No earlier release to fall back on."; exit 0; fi
          gh release edit "$prev" --repo "$repo" --latest
          echo "::notice::Downloads point at $prev until $tag has its files."

  # ---- one job per plugin and system: reuse the saved build, or compile it
  build:
    name: ${{ matrix.plugin }} (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        plugin: [KRUSH, PeakSlayer, MASTERFUSE, SPECTRAKILL, DARK, SHRAPNEL, RECOIL, PYRE, FLATLINE]
        name: [Windows, macOS]
        include:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Reuse the saved build if this plugin hasn't changed
        id: saved
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REBUILD: ${{ inputs.rebuild_all }}
        run: |
          set -euo pipefail
          p="${{ matrix.plugin }}"
          # the git fingerprint of plugins/<NAME>/: it changes only when a file in that folder changes
          key="$p-$RUNNER_OS-$(git rev-parse "HEAD:plugins/$p" | cut -c1-16)-r$RECIPE"
          echo "key=$key" >> "$GITHUB_OUTPUT"
          mkdir -p art
          if [ "$REBUILD" != "true" ] && gh release download build-cache --repo "$GITHUB_REPOSITORY" --pattern "$key.tar.gz" --dir art 2> /dev/null; then
            mv "art/$key.tar.gz" "art/$p.tar.gz"
            echo "hit=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$p (${{ matrix.name }}): unchanged, reused the saved build"
          else
            echo "hit=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$p (${{ matrix.name }}): changed or new, compiling"
          fi

      - name: Build ${{ matrix.plugin }}
        if: steps.saved.outputs.hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          p="${{ matrix.plugin }}"
          cmake -S "plugins/$p" -B "build/$p" -DCMAKE_BUILD_TYPE=Release
          cmake --build "build/$p" --config Release --parallel 4
          mkdir -p art
          # a tarball keeps the macOS bundles' symlinks and permissions intact. Only what the installers
          # use (VST3, AU, Standalone): the intermediate code library next to them is large, above all
          # on macOS (two architectures), and would make every saved build slow to store and fetch.
          # (relative paths only: on Windows an absolute path like D:\a\... reads to tar as "host D")
          src="build/$p/${p}_artefacts"
          parts=(); for d in VST3 AU Standalone; do [ -d "$src/Release/$d" ] && parts+=("Release/$d"); done
          tar -czf "art/$p.tar.gz" -C "$src" "${parts[@]}"
          ls -lh "art/$p.tar.gz"

      - name: Save the build for next time
        if: steps.saved.outputs.hit != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          p="${{ matrix.plugin }}"; key="${{ steps.saved.outputs.key }}"; repo="$GITHUB_REPOSITORY"
          # the hidden pre-release that holds the saved builds (several jobs may try to create it at once)
          gh release view build-cache --repo "$repo" > /dev/null 2>&1 ||
            gh release create build-cache --repo "$repo" --prerelease --target "$GITHUB_SHA" \
              --title "Build cache (internal, not a download)" \
              --notes "Saved plugin builds that the Build plugins workflow reuses so unchanged plugins aren't compiled again. Not for download. Safe to delete: everything then compiles once more." \
              > /dev/null 2>&1 || sleep 5
          mkdir -p upload && cp "art/$p.tar.gz" "upload/$key.tar.gz"
          gh release upload build-cache "upload/$key.tar.gz" --clobber --repo "$repo"
          # drop this plugin's older saved builds for this system (finding none is fine: "|| true",
          # since grep finding nothing counts as a failure under pipefail)
          old=$(gh release view build-cache --repo "$repo" --json assets --jq '.assets[].name' |
                  grep "^$p-$RUNNER_OS-" | grep -vx "$key.tar.gz" || true)
          for f in $old; do gh release delete-asset build-cache "$f" --repo "$repo" --yes || true; done
          echo "saved $key.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.name }}-${{ matrix.plugin }}
          path: art/${{ matrix.plugin }}.tar.gz
          if-no-files-found: error
          retention-days: 3

  # ---- per system: put every plugin's build back in place and make the downloads
  package:
    name: Package (${{ matrix.name }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: build-${{ matrix.name }}-*
          path: art
          merge-multiple: true

      - name: Unpack the builds
        shell: bash
        run: |
          set -euo pipefail
          source scripts/plugins.sh
          for entry in $PLUGINS; do
            IFS=: read -r target product code <<< "$entry"
            mkdir -p "build/$target/${target}_artefacts"
            tar -xzf "art/$target.tar.gz" -C "build/$target/${target}_artefacts"
          done

      - name: Package for Windows (.zip)
        if: runner.os == 'Windows'
        shell: bash
        run: bash scripts/package-windows.sh

      - name: Package for macOS (.pkg installer)
        if: runner.os == 'macOS'
        run: bash scripts/package-mac.sh

      - name: Check the Audio Units load (auval)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: bash scripts/check-au.sh

      - uses: actions/upload-artifact@v4
        with:
          name: plugins-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  # ---- tags only: the GitHub Release
  release:
    name: Publish the release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: plugins-*
          path: dist
          merge-multiple: true

      - name: Create the release (or update it) and attach the files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -l dist
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --latest
          else
            gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --latest \
              --title "Noise Division plugins ${GITHUB_REF_NAME}" \
              --notes "Free downloads of PEAKSLAYER, KRUSH, MASTERFUSE, SPECTRAKILL, DARK, SHRAPNEL, RECOIL, PYRE and FLATLINE, one by one or all together (NoiseDivision-Suite). Windows: unzip and copy the .vst3 to C:\\Program Files\\Common Files\\VST3. macOS: open the .pkg installer (AU, VST3 and the standalone app)."
          fi
